<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸福+感恩故事館 | 讓感謝被看見，讓幸福加滿分</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        amberwood: '#2C1A11',
                        cozybrown: '#4A2E1B',
                        warmgold: '#F4B251',
                        maplered: '#B83B26',
                        warmcream: '#FAF3E0',
                        lightamber: '#E8A352',
                        darkwood: '#1D120B'
                    },
                    fontFamily: {
                        serif: ['Noto Serif TC', 'serif'],
                        rounded: ['Zen Maru Gothic', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Zen Maru Gothic', 'Noto Serif TC', serif;
            background-color: #1a0f0a;
            color: #FAF3E0;
            overflow-x: hidden;
        }

        #leafCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .ambient-glow {
            background: radial-gradient(circle at 50% 20%, rgba(244, 178, 81, 0.18) 0%, rgba(184, 59, 38, 0.08) 50%, rgba(29, 18, 11, 0) 80%);
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #2C1A11;
        }
        ::-webkit-scrollbar-thumb {
            background: #B83B26;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #F4B251;
        }

        .floating-leaf {
            animation: float 4s ease-in-out infinite;
            transition: all 0.3s ease;
        }
        .floating-leaf:hover {
            transform: scale(1.05) rotate(2deg);
            filter: drop-shadow(0 0 12px rgba(244, 178, 81, 0.8));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
        }

        .modal-active {
            opacity: 1;
            pointer-events: auto;
            transition: opacity 0.4s ease;
        }
        .modal-inactive {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body class="relative min-h-screen bg-darkwood text-warmcream flex flex-col justify-between">

    <!-- 落葉動畫背景 -->
    <canvas id="leafCanvas"></canvas>
    <div class="fixed inset-0 ambient-glow pointer-events-none"></div>

    <!-- MAIN HEADER -->
    <header class="relative z-20 pt-8 pb-4 px-4 text-center">
        <div class="max-w-4xl mx-auto">
            <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-warmgold/10 border border-warmgold/30 text-warmgold text-sm mb-4 backdrop-blur-md">
                <i class="fa-solid fa-feather-pointed"></i> 幸福+感恩分享
            </div>
            <h1 class="text-4xl md:text-6xl font-serif font-bold text-transparent bg-clip-text bg-gradient-to-r from-warmgold via-lightamber to-maplered tracking-wide mb-3 drop-shadow-md">
                幸福+感謝故事館
            </h1>
            <p class="text-base md:text-lg text-warmcream/80 max-w-2xl mx-auto font-serif leading-relaxed italic">
                「每片落下的楓葉裡，都是真摯感謝!」
            </p>
        </div>

        <div class="flex flex-wrap items-center justify-center gap-4 mt-8">
            <!-- 重新整理雲端資料按鈕 -->
            <button onclick="fetchGoogleSheetData(true)" class="px-5 py-2.5 rounded-2xl text-xs md:text-sm font-bold bg-amberwood/80 border border-warmgold/40 text-warmgold hover:bg-warmgold hover:text-amberwood transition-all shadow-lg flex items-center gap-2">
                <i class="fa-solid fa-arrows-rotate" id="refreshIcon"></i> 重新載入最新故事
            </button>

            <!-- 連結到 Google 問卷表單 -->
            <a href="https://forms.gle/UvwDEsgHPk1TAPCo9" target="_blank" rel="noopener noreferrer" class="px-6 py-2.5 rounded-2xl text-xs md:text-sm font-bold bg-gradient-to-r from-warmgold to-lightamber text-amberwood hover:brightness-110 transition-all shadow-lg shadow-warmgold/20 flex items-center gap-2 transform hover:-translate-y-0.5">
                <i class="fa-solid fa-leaf"></i> 歡迎分享感謝小故事
            </a>
        </div>
    </header>

    <!-- CONTENT AREA -->
    <main class="relative z-20 max-w-6xl mx-auto px-4 py-6 w-full flex-grow">
        <div id="leavesSection" class="transition-all duration-500 py-4">
            <div class="text-center mb-8">
                <p id="statusMsg" class="text-warmgold/90 text-sm font-serif">
                    <i class="fa-solid fa-spinner fa-spin mr-1"></i> 正在連線...
                </p>
            </div>
            
            <div id="leavesGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 p-2 md:p-6 min-h-[300px]">
                <!-- 故事卡片將由 JS 動態產生 -->
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="relative z-20 text-center py-6 px-4 border-t border-warmgold/10 text-warmcream/50 text-xs">
        <p>感謝每一位在生命中帶來溫暖的人 🍁 幸福+感謝故事館</p>
        <p class="mt-1">資料來源</p>
    </footer>

    <!-- MODAL: 故事詳細內容 -->
    <div id="storyModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-inactive bg-black/70 backdrop-blur-sm">
        <div class="relative w-full max-w-xl bg-gradient-to-b from-amberwood via-cozybrown to-darkwood border border-warmgold/40 rounded-3xl p-6 md:p-8 shadow-2xl text-warmcream transform transition-transform duration-300 scale-95" id="storyModalContent">
            
            <button onclick="closeStoryModal()" class="absolute top-4 right-4 w-10 h-10 rounded-full bg-black/30 border border-warmgold/30 flex items-center justify-center text-warmgold hover:bg-maplered hover:text-white transition-all">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>

            <div class="flex items-center gap-2 mb-4">
                <span id="modalCategory" class="px-3 py-1 rounded-full text-xs font-bold bg-maplered/30 border border-maplered/50 text-warmgold">
                    感恩分享 (B欄)
                </span>
                <span id="modalDate" class="text-xs text-warmcream/50"></span>
            </div>

            <h3 id="modalTitle" class="text-2xl md:text-3xl font-serif font-bold text-warmgold mb-2"></h3>
            <div class="flex items-center gap-2 text-sm text-lightamber mb-6 italic">
                <span>致：</span><span id="modalRecipient" class="font-bold"></span>
            </div>

            <div class="bg-black/20 rounded-2xl p-5 border border-warmgold/10 mb-6 max-h-60 overflow-y-auto leading-relaxed text-warmcream/90 text-sm md:text-base font-serif space-y-3 whitespace-pre-wrap" id="modalStoryBody">
            </div>

            <div class="bg-gradient-to-r from-warmgold/10 to-maplered/10 border-l-4 border-warmgold p-4 rounded-r-2xl text-warmgold italic text-sm">
                <i class="fa-solid fa-quote-left mr-2 opacity-50"></i>
                <span id="modalQuote">「世上所有的偶然遇見，都是溫暖的重逢。」</span>
            </div>

            <div class="mt-6 flex justify-end items-center text-xs text-warmcream/60">
                <button onclick="closeStoryModal()" class="px-6 py-2.5 rounded-xl bg-warmgold text-amberwood font-bold hover:bg-lightamber transition-all shadow-md">
                    關閉故事
                </button>
            </div>
        </div>
    </div>

    <!-- 提示 TOAST -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-gradient-to-r from-maplered to-cozybrown border border-warmgold/50 text-warmcream px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3">
        <i class="fa-solid fa-circle-check text-warmgold text-xl"></i>
        <span id="toastMsg" class="text-sm font-semibold"></span>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // ==========================================
        // ⚙️ Google 雲端試算表設定區
        // ==========================================
        // 請將此處字串替換為您 Google 試算表（幸福+感謝故事館）網址中的試算表 ID：
        const SPREADSHEET_ID = '1mle9Hf4ft7c5R73WZ5LDe5hHAY4lVOpRYDVFSsuSMLY'; 
        const SHEET_NAME = '感恩分享';

        let storyData = [];

        // --- 1. 從 GOOGLE 試算表擷取資料 ---
        async function fetchGoogleSheetData(isManualRefresh = false) {
            const statusMsg = document.getElementById('statusMsg');
            const refreshIcon = document.getElementById('refreshIcon');
            
            if (refreshIcon) refreshIcon.classList.add('fa-spin');
            statusMsg.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> 連線中...';

            const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('連線試算表失敗，請確認試算表 ID 是否正確且已開放共用。');
                
                const text = await response.text();
                const jsonStr = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
                const data = JSON.parse(jsonStr);

                const rows = data.table.rows || [];
                const parsedStories = [];

                rows.forEach((row, index) => {
                    if (!row.c) return;

                    // 欄位對應（c[0]=A欄, c[1]=B欄, c[2]=C欄, c[3]=D欄...）
                    const colA = row.c[0] ? (row.c[0].f || row.c[0].v || '') : '';
                    const colB = row.c[1] ? (row.c[1].f || row.c[1].v || '') : ''; // 讀取 B 欄：感恩故事內容
                    const colC = row.c[2] ? (row.c[2].f || row.c[2].v || '') : '';
                    const colD = row.c[3] ? (row.c[3].f || row.c[3].v || '') : '';

                    const storyText = String(colB).trim();

                    // 若 B 欄為空或是表頭標題列則跳過
                    if (!storyText || storyText === '故事' || storyText === '感謝故事' || storyText === '故事內容') {
                        return;
                    }

                    // 標題預設抓 A 欄，若 A 欄為空則取 B 欄前 14 個字
                    const titleText = colA ? String(colA).trim() : (storyText.slice(0, 14) + (storyText.length > 14 ? '...' : ''));
                    const recipientText = colC ? String(colC).trim() : '身邊溫暖的人';
                    const quoteText = colD ? String(colD).trim() : '感謝有你，溫暖常在。';

                    parsedStories.push({
                        id: index + 1,
                        title: titleText,
                        recipient: recipientText,
                        date: new Date().toISOString().split('T')[0],
                        story: storyText, // B 欄位內容
                        quote: quoteText
                    });
                });

                if (parsedStories.length === 0) {
                    statusMsg.innerHTML = '⚠️ 試算表「感恩分享」工作表目前 B 欄尚無故事資料。';
                } else {
                    storyData = parsedStories;
                    statusMsg.innerHTML = `🍁 已成功自 Google 試算表載入 <strong>${storyData.length}</strong> 則感謝故事`;
                }

                renderLeaves();
                if (isManualRefresh) showToast("已重新載入最新雲端故事！");

            } catch (err) {
                console.warn('載入 Google 試算表失敗，啟動備份演示資料：', err);
                statusMsg.innerHTML = `<span class="text-maplered">⚠️ 雲端試算表未連線（請記得替換程式碼中的 SPREADSHEET_ID 並開啟共用檢視權限）</span>`;
                loadFallbackStories();
            } finally {
                if (refreshIcon) refreshIcon.classList.remove('fa-spin');
            }
        }

        // 備用演示資料（避免剛開啟尚未設定 ID 時完全無內容）
        function loadFallbackStories() {
            storyData = [
                {
                    id: 1,
                    title: '那碗暖心熱湯',
                    recipient: '夜市老火車站麵攤老闆娘',
                    date: '2026-11-15',
                    story: '（範例資料）記得那是幾年前一個寒冷的冬夜，加完班錯過了末班車。走到巷口的麵攤，老闆娘端了一碗熱騰騰的湯給我：「孩子辛苦了，這碗阿姨請你。」那天的湯特別甜，溫暖了我整個低潮的季節。',
                    quote: '有時候，一碗熱湯就能為孤單的夜點亮整座城市。'
                },
                {
                    id: 2,
                    title: '雨天裡的雨傘',
                    recipient: '捷運站陌生乘客',
                    date: '2026-10-20',
                    story: '（範例資料）下暴雨的午後，一位準備搭車的小姐把手上的折疊傘遞給了我：「這把傘送你吧！別淋濕感冒了。」那把紅傘，我至今依然珍藏著。',
                    quote: '陌生人的善意，是漫長雨季裡最燦爛的陽光。'
                }
            ];
            renderLeaves();
        }

        // --- 2. 渲染葉片卡片 ---
        function renderLeaves() {
            const grid = document.getElementById('leavesGrid');
            grid.innerHTML = '';

            storyData.forEach((item, index) => {
                const leafElem = document.createElement('div');
                leafElem.className = 'floating-leaf cursor-pointer bg-amberwood/60 border border-warmgold/20 rounded-2xl p-5 flex flex-col justify-between shadow-xl backdrop-blur-sm relative group hover:border-warmgold/60';
                leafElem.style.animationDelay = `${(index % 5) * 0.5}s`;
                leafElem.onclick = () => openStoryModal(item.id);

                const iconColor = index % 2 === 0 ? 'text-maplered' : 'text-warmgold';

                leafElem.innerHTML = `
                    <div class="flex items-center justify-between mb-3">
                        <i class="fa-solid fa-leaf ${iconColor} text-2xl group-hover:rotate-45 transition-transform duration-300"></i>
                        <span class="text-[10px] text-warmgold/60 bg-warmgold/10 px-2 py-0.5 rounded-full border border-warmgold/20">楓葉 #${index + 1}</span>
                    </div>
                    <div>
                        <h4 class="font-serif font-bold text-base text-warmcream group-hover:text-warmgold transition-colors mb-1 truncate">
                            ${item.title}
                        </h4>
                        <p class="text-xs text-warmcream/60 line-clamp-3 leading-relaxed">
                            ${item.story}
                        </p>
                    </div>
                    <div class="mt-4 pt-2 border-t border-warmgold/10 flex justify-between items-center text-[10px] text-warmcream/50">
                        <span class="truncate max-w-[130px]">致: ${item.recipient}</span>
                        <span class="text-warmgold">閱讀 ></span>
                    </div>
                `;
                grid.appendChild(leafElem);
            });
        }

        // --- 3. 視窗互動 ---
        function openStoryModal(id) {
            const story = storyData.find(item => item.id === id);
            if (!story) return;

            document.getElementById('modalTitle').innerText = story.title;
            document.getElementById('modalRecipient').innerText = story.recipient;
            document.getElementById('modalDate').innerText = story.date || '';
            document.getElementById('modalStoryBody').innerText = story.story;
            document.getElementById('modalQuote').innerText = story.quote || '感謝有你，溫暖常在。';

            const modal = document.getElementById('storyModal');
            const content = document.getElementById('storyModalContent');
            modal.classList.remove('modal-inactive');
            modal.classList.add('modal-active');
            content.classList.remove('scale-95');
            content.classList.add('scale-100');
        }

        function closeStoryModal() {
            const modal = document.getElementById('storyModal');
            const content = document.getElementById('storyModalContent');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            modal.classList.remove('modal-active');
            modal.classList.add('modal-inactive');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // --- 4. 背景飄落楓葉粒子動畫 ---
        const canvas = document.getElementById('leafCanvas');
        const ctx = canvas.getContext('2d');
        let leavesArray = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class MapleLeaf {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = -20;
                this.size = Math.random() * 12 + 8;
                this.speedY = Math.random() * 1.2 + 0.6;
                this.speedX = Math.random() * 1 - 0.5;
                this.rotation = Math.random() * 360;
                this.rotSpeed = Math.random() * 1.5 - 0.75;
                this.opacity = Math.random() * 0.6 + 0.3;
                const colors = ['#B83B26', '#F4B251', '#E8A352', '#8C2B1B'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }
            update() {
                this.y += this.speedY;
                this.x += Math.sin(this.y / 30) + this.speedX;
                this.rotation += this.rotSpeed;
                if (this.y > canvas.height + 20) this.reset();
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate((this.rotation * Math.PI) / 180);
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.moveTo(0, -this.size);
                ctx.quadraticCurveTo(this.size * 0.3, -this.size * 0.4, this.size * 0.8, -this.size * 0.5);
                ctx.quadraticCurveTo(this.size * 0.4, 0, this.size * 0.9, this.size * 0.4);
                ctx.quadraticCurveTo(this.size * 0.2, this.size * 0.3, 0, this.size);
                ctx.quadraticCurveTo(-this.size * 0.2, this.size * 0.3, -this.size * 0.9, this.size * 0.4);
                ctx.quadraticCurveTo(-this.size * 0.4, 0, -this.size * 0.8, -this.size * 0.5);
                ctx.quadraticCurveTo(-this.size * 0.3, -this.size * 0.4, 0, -this.size);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }
        }

        function initLeaves() {
            leavesArray = [];
            const numberOfLeaves = Math.min(Math.floor(window.innerWidth / 35), 35);
            for (let i = 0; i < numberOfLeaves; i++) {
                const leaf = new MapleLeaf();
                leaf.y = Math.random() * canvas.height;
                leavesArray.push(leaf);
            }
        }

        function animateLeaves() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            leavesArray.forEach(leaf => {
                leaf.update();
                leaf.draw();
            });
            requestAnimationFrame(animateLeaves);
        }

        // 初始化
        window.onload = function() {
            initLeaves();
            animateLeaves();
            fetchGoogleSheetData();
        };
    </script>
</body>
</html>
