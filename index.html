<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>幸福+感謝故事館</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
    body {
      font-family: 'Noto Sans TC', sans-serif;
    }
    .line-clamp-3 {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-amber-50/40 text-slate-800 min-h-screen flex flex-col antialiased">

  <!-- 頂部公告 / 資料來源提示 -->
  <div class="bg-amber-100/80 border-b border-amber-200 text-amber-900 text-xs sm:text-sm px-4 py-2 text-center flex items-center justify-center gap-2">
    <i data-lucide="info" class="w-4 h-4 flex-shrink-0"></i>
    <span>本站故事源自同仁的真實反饋，由 HR 審核確認後公開。敏感個資皆已受到保護。</span>
  </div>

  <!-- Header 導覽 -->
  <header class="bg-white/90 backdrop-blur sticky top-0 z-30 shadow-sm border-b border-rose-100">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="p-2 bg-rose-500 text-white rounded-xl shadow-rose-200 shadow-md">
          <i data-lucide="heart" class="w-5 h-5 fill-current"></i>
        </span>
        <span class="font-bold text-xl tracking-tight text-slate-800">幸福+感謝故事館</span>
      </div>

      <div class="flex items-center space-x-3">
        <!-- 抽一份幸福按鈕 -->
        <button id="randomStoryBtn" class="flex items-center space-x-1.5 px-3.5 py-2 rounded-full border border-rose-300 text-rose-600 hover:bg-rose-50 transition text-sm font-medium shadow-sm">
          <i data-lucide="sparkles" class="w-4 h-4"></i>
          <span>抽一份幸福</span>
        </button>

        <!-- 表單按鈕 -->
        <a id="shareFormBtn" href="#" target="_blank" rel="noopener noreferrer" 
           class="flex items-center space-x-1.5 px-4 py-2 rounded-full bg-rose-500 hover:bg-rose-600 text-white transition text-sm font-medium shadow-md shadow-rose-200">
          <i data-lucide="send" class="w-4 h-4"></i>
          <span class="hidden sm:inline">我要分享感謝</span>
          <span class="sm:hidden">分享感謝</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Hero 區域 -->
  <section class="max-w-6xl mx-auto px-4 sm:px-6 pt-10 pb-6 text-center">
    <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-rose-100 text-rose-700 text-xs sm:text-sm font-medium mb-4">
      <i data-lucide="clock" class="w-4 h-4"></i>
      感謝留言提交後需經審核，通過後方會在此展示
    </div>
    <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight mb-3">
      傳遞每一份溫暖與支持
    </h1>
    <p class="text-slate-600 max-w-xl mx-auto text-sm sm:text-base leading-relaxed mb-6">
      因為有你們的並肩作戰，讓日常的每一步都充滿能量。留下你的感恩小故事，還能參與年終幸福抽獎喔！
    </p>

    <!-- 統計卡片 -->
    <div class="inline-flex items-center gap-6 bg-white px-6 py-3 rounded-2xl shadow-sm border border-rose-100">
      <div class="text-left">
        <span class="block text-xs text-slate-400">目前公開感謝</span>
        <div class="flex items-baseline gap-1">
          <span id="totalStoriesCount" class="text-2xl font-bold text-rose-600 leading-none">--</span>
          <span class="text-xs text-slate-500">篇故事</span>
        </div>
      </div>
      <div class="h-8 w-px bg-slate-100"></div>
      <div class="text-left">
        <span class="block text-xs text-slate-400">活動狀態</span>
        <span class="inline-flex items-center gap-1.5 text-emerald-600 text-sm font-medium">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          熱烈募集與公開中
        </span>
      </div>
    </div>
  </section>

  <!-- 故事卡片列表 -->
  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-6 flex-grow w-full">
    <!-- 篩選列 -->
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
        <i data-lucide="message-square-heart" class="w-5 h-5 text-rose-500"></i>
        溫暖故事牆
      </h2>
      <button id="refreshBtn" class="text-slate-500 hover:text-slate-700 text-xs flex items-center gap-1">
        <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i> 重新載入
      </button>
    </div>

    <!-- 載入中骨架屏 -->
    <div id="loadingSkeleton" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
      <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm animate-pulse h-48"></div>
      <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm animate-pulse h-48"></div>
      <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm animate-pulse h-48"></div>
    </div>

    <!-- 故事卡片容器 -->
    <div id="storiesContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 hidden"></div>

    <!-- 查無資料提示 -->
    <div id="emptyState" class="hidden text-center py-16 bg-white rounded-2xl border border-dashed border-slate-200">
      <i data-lucide="heart-off" class="w-12 h-12 text-slate-300 mx-auto mb-3"></i>
      <p class="text-slate-600 font-medium">目前還沒有公開的感謝故事</p>
      <p class="text-slate-400 text-xs mt-1">快來成為第一個分享溫暖的人吧！</p>
    </div>
  </main>

  <!-- 頁尾 -->
  <footer class="bg-white border-t border-slate-100 mt-12 py-6 text-center text-xs text-slate-400">
    <p>幸福+感謝故事館 © 2026 HR 員工關係推展小組</p>
    <p class="mt-1">為確保個人隱私，抽獎明單與身分資料採內部加密隔離保存。</p>
  </footer>

  <!-- 故事完整詳情 Modal -->
  <div id="storyModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm hidden opacity-0 transition-opacity duration-200">
    <div id="storyModalBox" class="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-7 shadow-2xl transform scale-95 transition-transform duration-200 max-h-[85vh] flex flex-col">
      <!-- 頂部資訊 -->
      <div class="flex items-center justify-between border-b border-slate-100 pb-4 mb-4">
        <span id="modalCategory" class="px-3 py-1 rounded-full text-xs font-semibold bg-rose-50 text-rose-600 border border-rose-100">
          分類
        </span>
        <button id="closeModalBtn" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- 內容區 (可滾動) -->
      <div class="overflow-y-auto flex-grow pr-1 space-y-4">
        <h3 id="modalTitle" class="text-xl font-bold text-slate-900 leading-snug"></h3>
        <p id="modalContent" class="text-slate-600 text-sm sm:text-base leading-relaxed whitespace-pre-line"></p>
      </div>

      <!-- 底部來源資訊 -->
      <div class="border-t border-slate-100 pt-4 mt-4 flex items-center justify-between text-xs text-slate-400">
        <div class="flex items-center gap-1.5 font-medium text-slate-700">
          <i data-lucide="user" class="w-3.5 h-3.5 text-rose-500"></i>
          <span id="modalAuthor"></span>
        </div>
        <span id="modalDate"></span>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 參數設定區 (請務必將此處換成您的真實網址)
    // ==========================================
    const CONFIG = {
      // 步驟二部署完畢後所取得的 Apps Script 網頁應用程式 URL
      GAS_API_URL: "https://script.google.com/macros/s/AKfycbzGefjPaHIJHjlg40y8K_ARWH6qsFO85I_STi8WaUZtHY02VzqLc_QGomMyipGqXJBFHA/exec",
      // HR 指定填寫的 Google Forms 網址
      GOOGLE_FORM_URL: "https://forms.gle/kR7faHQzXvwSVrUb9"
    };

    let cachedStories = [];

    // DOM 元素快取
    const elements = {
      container: document.getElementById('storiesContainer'),
      skeleton: document.getElementById('loadingSkeleton'),
      emptyState: document.getElementById('emptyState'),
      totalCount: document.getElementById('totalStoriesCount'),
      shareFormBtn: document.getElementById('shareFormBtn'),
      randomBtn: document.getElementById('randomStoryBtn'),
      refreshBtn: document.getElementById('refreshBtn'),
      modal: document.getElementById('storyModal'),
      modalBox: document.getElementById('storyModalBox'),
      closeModalBtn: document.getElementById('closeModalBtn'),
      modalCategory: document.getElementById('modalCategory'),
      modalTitle: document.getElementById('modalTitle'),
      modalContent: document.getElementById('modalContent'),
      modalAuthor: document.getElementById('modalAuthor'),
      modalDate: document.getElementById('modalDate')
    };

    // 初始化頁面
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      elements.shareFormBtn.href = CONFIG.GOOGLE_FORM_URL;
      loadStories();
      bindEvents();
    });

    // 綁定所有監聽事件
    function bindEvents() {
      // 點擊關閉 Modal
      elements.closeModalBtn.addEventListener('click', closeModal);
      elements.modal.addEventListener('click', (e) => {
        if (e.target === elements.modal) closeModal();
      });

      // 重新整理
      elements.refreshBtn.addEventListener('click', () => {
        loadStories();
      });

      // 抽一份幸福 (隨機展示故事)
      elements.randomBtn.addEventListener('click', () => {
        if (cachedStories.length === 0) {
          alert('目前尚無已審核的公開故事可供抽取！');
          return;
        }
        const randomIndex = Math.floor(Math.random() * cachedStories.length);
        openModal(cachedStories[randomIndex]);
      });
    }

    // 讀取故事資料
    async function loadStories() {
      setLoading(true);
      try {
        const response = await fetch(CONFIG.GAS_API_URL);
        const data = await response.json();

        if (data.status === "success" && Array.isArray(data.stories)) {
          cachedStories = data.stories;
          renderStories(cachedStories);
          elements.totalCount.textContent = data.total || cachedStories.length;
        } else {
          console.error("API 回傳失敗:", data.message);
          renderStories([]);
          elements.totalCount.textContent = '0';
        }
      } catch (err) {
        console.error("無法取得故事資料:", err);
        renderStories([]);
        elements.totalCount.textContent = '0';
      } finally {
        setLoading(false);
      }
    }

    // 渲染故事卡片
    function renderStories(stories) {
      elements.container.innerHTML = '';
      
      if (stories.length === 0) {
        elements.container.classList.add('hidden');
        elements.emptyState.classList.remove('hidden');
        return;
      }

      elements.emptyState.classList.add('hidden');
      elements.container.classList.remove('hidden');

      stories.forEach(story => {
        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl p-5 border border-slate-100 hover:border-rose-200 shadow-sm hover:shadow-md transition-all duration-200 cursor-pointer flex flex-col justify-between group";
        
        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between gap-2 mb-2.5">
              <span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-medium bg-rose-50 text-rose-600 border border-rose-100">
                ${escapeHtml(story.category || '感恩')}
              </span>
              <span class="text-xs text-slate-400">${escapeHtml(story.date || '')}</span>
            </div>
            <h3 class="font-bold text-slate-800 text-base mb-2 group-hover:text-rose-600 transition-colors">
              ${escapeHtml(story.title || '無標題')}
            </h3>
            <p class="text-slate-600 text-sm line-clamp-3 leading-relaxed mb-4">
              ${escapeHtml(story.content || '')}
            </p>
          </div>

          <div class="pt-3 border-t border-slate-50 flex items-center justify-between text-xs text-slate-500">
            <span class="flex items-center gap-1 font-medium text-slate-700">
              <i data-lucide="user" class="w-3.5 h-3.5 text-slate-400"></i>
              ${escapeHtml(story.author)}
            </span>
            <span class="text-rose-500 font-medium group-hover:underline flex items-center gap-0.5">
              閱讀更多 <i data-lucide="chevron-right" class="w-3 h-3"></i>
            </span>
          </div>
        `;

        card.addEventListener('click', () => openModal(story));
        elements.container.appendChild(card);
      });

      lucide.createIcons();
    }

    // Modal 控制
    function openModal(story) {
      elements.modalCategory.textContent = story.category || '感謝故事';
      elements.modalTitle.textContent = story.title || '無標題';
      elements.modalContent.textContent = story.content || '';
      elements.modalAuthor.textContent = story.author || '暖心天使 (匿名)';
      elements.modalDate.textContent = story.date || '';

      elements.modal.classList.remove('hidden');
      setTimeout(() => {
        elements.modal.classList.remove('opacity-0');
        elements.modalBox.classList.remove('scale-95');
      }, 10);
    }

    function closeModal() {
      elements.modal.classList.add('opacity-0');
      elements.modalBox.classList.add('scale-95');
      setTimeout(() => {
        elements.modal.classList.add('hidden');
      }, 200);
    }

    // 載入狀態樣式切換
    function setLoading(isLoading) {
      if (isLoading) {
        elements.skeleton.classList.remove('hidden');
        elements.container.classList.add('hidden');
        elements.emptyState.classList.add('hidden');
      } else {
        elements.skeleton.classList.add('hidden');
      }
    }

    // XSS 防護
    function escapeHtml(string) {
      const div = document.createElement('div');
      div.innerText = string;
      return div.innerHTML;
    }
  </script>
</body>
</html>
