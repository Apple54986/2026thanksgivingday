<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>幸福+感謝故事館 - Thanksgiving</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: 圓體/手寫可愛風格 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=M+PLUS+Rounded+1c:wght@500;700;800;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-cream: #FDF4DE;
    }
    body {
      font-family: 'M PLUS Rounded 1c', 'Noto Sans TC', sans-serif;
      background-color: var(--bg-cream);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(255, 178, 102, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 10%, rgba(255, 153, 51, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 50% 90%, rgba(255, 204, 153, 0.25) 0%, transparent 50%);
    }

    /* 便利貼動態微幅擺動動畫 (Gentle floating / Swaying) */
    @keyframes gentleSway1 {
      0%, 100% { transform: rotate(-1.5deg) translateY(0px); }
      50% { transform: rotate(-0.2deg) translateY(-6px); }
    }
    @keyframes gentleSway2 {
      0%, 100% { transform: rotate(1.8deg) translateY(0px); }
      50% { transform: rotate(0.4deg) translateY(-5px); }
    }
    @keyframes gentleSway3 {
      0%, 100% { transform: rotate(-0.8deg) translateY(-2px); }
      50% { transform: rotate(-2deg) translateY(3px); }
    }

    .sway-1 { animation: gentleSway1 4.2s ease-in-out infinite; }
    .sway-2 { animation: gentleSway2 4.8s ease-in-out infinite; }
    .sway-3 { animation: gentleSway3 5.3s ease-in-out infinite; }

    /* 滑鼠懸停時放大並稍稍加強陰影 */
    .sticky-card:hover {
      animation-play-state: paused;
      transform: scale(1.03) rotate(0deg) !important;
      z-index: 20;
    }

    /* 木紋標題板質感 */
    .wood-board {
      background: linear-gradient(180deg, #A76527 0%, #7E4314 100%);
      box-shadow: 0 8px 18px rgba(94, 49, 13, 0.25), inset 0 2px 3px rgba(255, 255, 255, 0.3);
      border: 4px solid #5C2D0C;
    }

    /* 雲朵/旗幟標籤 */
    .wood-ribbon {
      background: linear-gradient(180deg, #FFF6E5 0%, #F5DFC2 100%);
      box-shadow: 0 4px 10px rgba(138, 77, 23, 0.15);
    }

    /* 虛線內框 */
    .dashed-border {
      border: 2px dashed rgba(0, 0, 0, 0.12);
    }

    /* 文字截斷 */
    .line-clamp-4 {
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>

<body class="min-h-screen flex flex-col justify-between overflow-x-hidden relative selection:bg-orange-200">

  <!-- ================= 頂部裝飾與標題看板 ================= -->
  <header class="pt-6 pb-2 px-4 relative z-10 text-center max-w-6xl mx-auto w-full">
    
    <!-- 左上角活動標記 -->
    <div class="absolute left-4 top-4 hidden md:flex items-center gap-1.5 text-orange-600 font-extrabold text-2xl tracking-wider">
      <span class="text-3xl">🌸</span> 幸福+
    </div>

    <!-- 右上角 Thanksgiving 雲朵看板 -->
    <div class="absolute right-4 top-2 hidden md:block text-right">
      <div class="bg-white/85 backdrop-blur-sm border-2 border-orange-200 rounded-3xl px-5 py-2 shadow-sm inline-block">
        <div class="text-amber-800 font-black text-lg tracking-wide flex items-center justify-end gap-1">
          Thanksgiving <span class="text-orange-500">🧡</span>
        </div>
        <div class="text-xs text-amber-700/80 font-bold">感恩節 · 分享感謝 · 傳遞幸福</div>
      </div>
    </div>

    <!-- 主木板看板標題 -->
    <div class="inline-block relative my-3">
      <!-- 楓葉飄落微裝飾 -->
      <span class="absolute -top-4 -left-6 text-2xl -rotate-12 select-none">🍁</span>
      <span class="absolute -bottom-2 -right-6 text-2xl rotate-45 select-none">🍂</span>

      <!-- 復古木牌 -->
      <div class="wood-board rounded-[38px] px-8 sm:px-14 py-3 sm:py-4 text-white relative shadow-xl">
        <h1 class="text-2xl sm:text-4xl md:text-5xl font-black tracking-wider text-amber-50 drop-shadow-[0_2px_4px_rgba(0,0,0,0.4)] flex items-center justify-center gap-2">
          幸福<span class="text-amber-300">+</span> 感謝故事館 <span class="text-red-300 text-3xl sm:text-4xl">♡</span>
        </h1>
      </div>

      <!-- 下方掛旗/米白絲帶 -->
      <div class="wood-ribbon -mt-3.5 sm:-mt-4 mx-auto w-[90%] sm:w-[85%] py-1.5 sm:py-2 px-4 rounded-full border border-amber-300 text-amber-900 font-black text-xs sm:text-sm tracking-widest shadow-md">
        感謝有你，讓幸福更完整！♡
      </div>
    </div>

    <!-- 手機版副標題提示 -->
    <div class="md:hidden mt-2 text-xs font-bold text-amber-800/80">
      🍂 感恩節 · 分享感謝 · 傳遞幸福 🍁
    </div>
  </header>

  <!-- ================= 主內容：便利貼故事牆 ================= -->
  <main class="max-w-6xl mx-auto px-4 sm:px-8 py-4 flex-grow w-full relative z-10">

    <!-- 載入中骨架 -->
    <div id="loadingBox" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 py-6">
      <div class="h-56 bg-orange-100/60 rounded-3xl animate-pulse"></div>
      <div class="h-56 bg-pink-100/60 rounded-3xl animate-pulse"></div>
      <div class="h-56 bg-blue-100/60 rounded-3xl animate-pulse"></div>
      <div class="h-56 bg-amber-100/60 rounded-3xl animate-pulse"></div>
    </div>

    <!-- 便利貼清單 (預設隱藏，由 JS 動態生成) -->
    <div id="storiesWall" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 py-4 hidden"></div>

    <!-- 尚無故事提示 -->
    <div id="emptyBox" class="hidden text-center py-16">
      <div class="text-5xl mb-3">💌</div>
      <p class="text-amber-900 font-bold text-lg">目前還沒有公開的感謝留言</p>
      <p class="text-amber-700/70 text-sm mt-1">點擊下方按鈕，成為第一個傳遞心意的人吧！</p>
    </div>
  </main>

  <!-- ================= 底部操作列與南瓜裝飾 ================= -->
  <footer class="relative z-20 pb-8 pt-4 px-4 max-w-6xl mx-auto w-full">
    <div class="flex flex-col md:flex-row items-center justify-between gap-5 bg-white/60 backdrop-blur-md rounded-3xl p-4 sm:p-6 border border-amber-200/60 shadow-lg">
      
      <!-- 左側溫馨標語 -->
      <div class="flex items-center gap-3 text-center md:text-left">
        <span class="text-3xl select-none hidden sm:inline">🎃</span>
        <div>
          <div class="text-amber-900 font-black text-base sm:text-lg flex items-center justify-center md:justify-start gap-1">
            讓感謝被看見，讓幸福加滿分 <span class="text-red-500 font-bold">♡</span>
          </div>
          <div class="text-xs text-amber-700 font-bold mt-0.5">
            目前已累積 <span id="storyCount" class="text-orange-600 font-extrabold text-sm">--</span> 份溫暖心意
          </div>
        </div>
      </div>

      <!-- 右側按鈕群組 (抽一份幸福 / 我要分享感謝) -->
      <div class="flex items-center gap-3 sm:gap-4 flex-wrap justify-center">
        <!-- 抽一份幸福按鈕 (高亮立體橘色) -->
        <button id="drawBtn" class="flex items-center gap-2 px-6 py-3 rounded-full text-white font-extrabold text-sm sm:text-base tracking-wide bg-gradient-to-b from-orange-400 to-orange-500 hover:from-orange-500 hover:to-orange-600 shadow-[0_5px_15px_rgba(249,115,22,0.4)] hover:shadow-orange-400/50 active:scale-95 transition-all">
          <span>🎁</span>
          <span>抽一份幸福</span>
          <span class="text-xs opacity-90">›</span>
        </button>

        <span class="text-amber-300 font-light hidden sm:inline">|</span>

        <!-- 我要分享感謝 (白底輕巧木質感) -->
        <a id="shareBtn" href="#" target="_blank" rel="noopener noreferrer" 
           class="flex items-center gap-2 px-6 py-3 rounded-full bg-white hover:bg-orange-50 text-amber-900 font-extrabold text-sm sm:text-base tracking-wide border-2 border-amber-200 shadow-md active:scale-95 transition-all">
          <span>🚀</span>
          <span>我要分享感謝</span>
          <span class="text-xs text-amber-500 font-bold">›</span>
        </a>
      </div>
    </div>

    <!-- 底部暖心告示 -->
    <div class="text-center text-xs text-amber-800/60 font-bold mt-3">
      感謝，讓幸福更有溫度 ♡ 
    </div>
  </footer>

  <!-- ================= 閱讀完整故事彈出視窗 (Modal) ================= -->
  <div id="storyModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-amber-950/40 backdrop-blur-sm hidden opacity-0 transition-opacity duration-200">
    <div id="modalBox" class="bg-[#FFFDF7] border-4 border-amber-200 rounded-[32px] max-w-md w-full p-6 sm:p-8 shadow-2xl transform scale-90 transition-transform duration-200 relative">
      <!-- 頂部裝飾圖釘 -->
      <div class="absolute -top-4 left-1/2 -translate-x-1/2 text-2xl select-none">
        📌
      </div>

      <div class="text-center border-b border-amber-100 pb-3 mb-4">
        <h3 class="text-lg font-black text-amber-900 flex items-center justify-center gap-1.5">
          <span>💌</span> 一份溫馨的感謝
        </h3>
      </div>

      <!-- 故事本文 -->
      <div class="max-h-[60vh] overflow-y-auto pr-2">
        <p id="modalContent" class="text-amber-950/85 text-base sm:text-lg leading-relaxed whitespace-pre-line font-medium"></p>
      </div>

      <!-- 關閉按鈕（修復：補回被遺漏的按鈕與閉合標籤） -->
      <div class="mt-6 text-center">
        <button id="closeModalBtn" class="px-6 py-2 rounded-full
